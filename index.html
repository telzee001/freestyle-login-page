<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Login Page</title>
    <script src="script.js" defer></script>
</head>

<body>
    <div class="login-box">
        <div class="social-login">
            <h2>Login</h2>
            <p>New User? <a href="#">Create New Account</a></p>

            <div class="social-login-buttons">
                <button class="google-login"><i class="fa-brands fa-google"></i> Login with Google</button>
                <button class="facebook-login"><i class="fa-brands fa-facebook"></i> Login with Facebook</button>
                <button class="microsoft-login"><i class="fa-brands fa-microsoft"></i> Login with Microsoft</button>
                <button class="apple-login"><i class="fa-brands fa-apple"></i> Login with Apple</button>
                <button class="telegram-login"><i class="fa-brands fa-telegram"></i> Login with Telegram</button>
            </div>

        </div>
        <div class="icon-login">
            <button class="x-icon-login"><i class="fa-brands fa-x-twitter"></i></button>
            <button class="steam-icon-login"><i class="fa-brands fa-steam"></i></button>
            <button class="twitch-icon-login"><i class="fa-brands fa-twitch"></i></button>
            <button class="discord-icon-login"><i class="fa-brands fa-discord"></i></button>
        </div>
        <div class="divider-line">or
        </div>
        <div class="email-login">
            <form id="email-login-form">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Email" required>
            </form>
        </div>
        <div class="other-login-actions">
            <button class="turbo-go-link">Turbo Link</button>
            <button class="login-with-password">Login with Password</button>
        </div>
    </div>
    <div class="intro-section">
        <h1>Welcome to T.PAY</h1>
        <p>Experience the future of secure and seamless payments with T.PAY. Join us today and enjoy a world of
            convenience at your fingertips.</p>
    </div>
</body>

</html>
