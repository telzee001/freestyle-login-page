<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login Page</title>
    <script src="script.js" defer></script>
</head>

<body>
    <div class="login-box">
        <div class="social-login">
            <h2>Login</h2>
            <p>New User? <a href="#">Create New Account</a></p>

            <div class="social-login-buttons">
                <button class="google-login">Login with Google</button>
                <button class="facebook-login">Login with Facebook</button>
                <button class="microsoft-login">Login with Microsoft</button>
                <button class="apple-login">Login with Apple</button>
            </div>
       
        </div>
        <div class="icon-login">
            <button class="x-icon-login">X</button>
            <button class="steam-icon-login">Steam</button>
            <button class="twitch-icon-login">Twitch</button>
            <button class="discord-icon-login">Discord</button>
        </div>
        <div class="divider-line">or
        </div>
        <div class="email-login">
            <form id="email-login-form">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Email" required>
            </form>
        </div>
        <div class="other-login-actions">
            <button class="get-super-link">Get Super Link</button>
            <button class="login-with-password">Login with Password</button>
        </div>
    </div>
    <div class="intro-section">
        <h1>Welcome to T.PAY</h1>
        <p>Experience the future of secure and seamless payments with T.PAY. Join us today and enjoy a world of convenience at your fingertips.</p>
    </div>
</body>

</html>
