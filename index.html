<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Login Page</title>
    <script src="script.js" defer></script>
</head>

<body>
    <div class="intro-section">
        <h1>    
            <span class="letter" style="--i:1">W</span>
            <span class="letter" style="--i:2">e</span>
            <span class="letter" style="--i:3">l</span>
            <span class="letter" style="--i:4">c</span>
            <span class="icon" style="--i:5"><i class="fa-brands fa-bitcoin"></i></i></span>
            <span class="letter" style="--i:6">m</span>
            <span class="letter" style="--i:7">e</span>
        </h1>
        <div class="intro-divider">
           <span class="icon" style="--i:7.5"><i class="fa-solid fa-angles-right"></i></span>
           <span class="icon" style="--i:8"><i class="fa-solid fa-angles-right"></i></span>
           <span class="word" style="--i:8.5">TO</span>
           <span class="icon" style="--i:9"><i class="fa-solid fa-angles-right"></i></span>
           <span class="icon" style="--i:10"><i class="fa-solid fa-angles-right"></i></span>
           <span class="icon" style="--i:11"><i class="fa-solid fa-angles-right"></i></span>

        </div>
        <h2>
            <span class="word" style="--i:12">Telzee</span>
            <span class="word" style="--i:13">Crypto</span>
            <span class="word" style="--i:14">Xchange</span>
        </h2>
        <p>
            <span class="word" style="--i:15">Experience</span>
            <span class="word" style="--i:16">the</span>
            <span class="word" style="--i:17">future</span>
            <span class="word" style="--i:18">of</span>
            <span class="word" style="--i:19">secure</span>
            <span class="word" style="--i:20">and</span>
            <span class="word" style="--i:21">seamless</span>
            <span class="word" style="--i:22">Crypto</span>
            <span class="word" style="--i:23">payments</span>
            <span class="word" style="--i:24">with</span>
            <span class="word" style="--i:25">Telzee</span>
            <span class="word" style="--i:26">Crypto</span>
            <span class="word" style="--i:27">Xchange.</span>
            <span class="word" style="--i:28">Join</span>
            <span class="word" style="--i:29">us</span>
            <span class="word" style="--i:30">today</span>
            <span class="word" style="--i:31">and</span>
            <span class="word" style="--i:32">enjoy</span>
            <span class="word" style="--i:33">a</span>
            <span class="word" style="--i:34">world</span>
            <span class="word" style="--i:35">of</span>
            <span class="word" style="--i:36">convenience</span>
            <span class="word" style="--i:37">at</span>
            <span class="word" style="--i:38">your</span>
            <span class="word" style="--i:39">fingertips.</span>
        </p>
    </div>

    <div class="login-box">
        <div class="social-login">
            <h2><i class="fa-solid fa-circle-user"></i> Login</h2>
            <p>New User? <a href="#">Register</a></p>
            <div class="social-login-buttons">
                <button class="google-login"><i class="fa-brands fa-google"></i> Google</button>
                <button class="facebook-login"><i class="fa-brands fa-facebook"></i> Facebook</button>
                <button class="apple-login"><i class="fa-brands fa-apple"></i> Apple</button>
                <button class="telegram-login"><i class="fa-brands fa-telegram"></i> Telegram</button>
            </div>

        </div>
        <div class="icon-login">
            <button class="x-icon-login"><i class="fa-brands fa-x-twitter"></i></button>
            <button class="steam-icon-login"><i class="fa-brands fa-steam"></i></button>
            <button class="twitch-icon-login"><i class="fa-brands fa-twitch"></i></button>
            <button class="discord-icon-login"><i class="fa-brands fa-discord"></i></button>
        </div>
        <div class="divider-line">or
        </div>
        <div class="email-login">
            <form id="email-login-form">
                <label for="email" class="visually-hidden">Email:</label>
                <input type="email" id="email" name="email" placeholder="Email" required>
                <label for="password" class="visually-hidden">Password:</label>
                <input type="password" id="password" name="password" placeholder="Password" required>
                <div class="other-login-actions">
                    <button type="submit" class="login-with-email"><i class="fa-solid fa-envelope"></i> Login with Email</button>
                    <button type="button" class="get-referral-link">Get Referral Link</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
